version: 2

models:
  - name: DIM_CLIENT
    description: "One row per client, summarizing session and order behavior across the website."
    columns:
      - name: client_id
        description: "Unique identifier for each client."
        tests:
          - unique
          - not_null

      - name: first_session_at
        description: "Timestamp of the client's first recorded session."
        tests:
          - not_null

      - name: last_session_at
        description: "Timestamp of the client's most recent recorded session."

      - name: total_sessions
        description: "Total number of distinct sessions recorded for the client."

      - name: total_orders
        description: "Total number of distinct orders placed by the client."

      - name: converted_sessions
        description: "Number of sessions for the client that resulted in an order."

      - name: has_ever_ordered
        description: "Flag indicating whether the client has ever placed at least one order."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: DIM_EMPLOYEE
    description: "One row per employee, including both active employees and employees who have already quit."
    columns:
      - name: employee_id
        description: "Unique identifier for each employee."
        tests:
          - unique
          - not_null

      - name: name
        description: "Employee full name."

      - name: title
        description: "Employee job title."

      - name: city
        description: "Employee city."

      - name: address
        description: "Employee address."

      - name: annual_salary
        description: "Annual salary for the employee."

      - name: hire_date
        description: "Date the employee joined the company."
        tests:
          - not_null

      - name: quit_date
        description: "Date the employee left the company, if applicable."

      - name: employment_status
        description: "Current employment status for the employee."
        tests:
          - accepted_values:
              arguments:
                values: ['active', 'inactive']

      - name: tenure_days
        description: "Number of days between hire date and quit date or current date."

      - name: source_modified_at
        description: "Last modified timestamp from the source system."

      - name: fivetran_synced_at
        description: "Timestamp when the record was last synced by Fivetran."

  - name: DIM_FINANCES
    description: "Daily summary of orders and expenses, including shipping revenue proxy, tax information, and categorized expenses."
    columns:
      - name: business_date
        description: "Business date for the daily financial summary."
        tests:
          - unique
          - not_null

      - name: order_count
        description: "Count of distinct orders placed on the business date."

      - name: total_shipping_cost
        description: "Total shipping cost recorded for orders on the business date."

      - name: avg_tax_rate
        description: "Average tax rate across orders on the business date."

      - name: total_expense
        description: "Total expense amount recorded on the business date."

      - name: hr_expense
        description: "Expense amount categorized as HR expense."

      - name: tech_tool_expense
        description: "Expense amount categorized as tech tool expense."

      - name: warehouse_expense
        description: "Expense amount categorized as warehouse expense."

  - name: DIM_ITEM
    description: "One row per item sold on the website. Stores item-level attributes and preserves multiple observed prices as an array."
    columns:
      - name: item_id
        description: "Surrogate key for each item."
        tests:
          - unique
          - not_null

      - name: item_name
        description: "Normalized item name."
        tests:
          - not_null

      - name: price_per_unit_array
        description: "Array of distinct prices observed for the item over time."

      - name: first_item_view_at
        description: "Timestamp of the first observed item view for the item."

      - name: last_item_view_at
        description: "Timestamp of the most recent observed item view for the item."

  - name: FACT_ORDER
    description: "One row per order, summarizing its order, client, payment, and shipping details."
    columns:
      - name: order_id
        description: "Unique identifier for each order."
        tests:
          - unique
          - not_null

      - name: session_id
        description: "Session associated with the order."
        tests:
          - not_null

      - name: client_id
        description: "Client associated with the order."

      - name: order_at
        description: "Timestamp when the order was placed."
        tests:
          - not_null

      - name: client_name
        description: "Client name recorded on the order."

      - name: state
        description: "Shipping state for the order."

      - name: phone
        description: "Phone number recorded on the order."

      - name: payment_method
        description: "Payment method used for the order."

      - name: payment_info
        description: "Payment info token or masked payment field."

      - name: shipping_address
        description: "Shipping address recorded on the order."

      - name: shipping_cost
        description: "Shipping cost recorded on the order."

      - name: tax_rate
        description: "Tax rate recorded on the order."

  - name: FACT_SESSION
    description: "One row per website session, summarizing session events including page views, item views, cart activity, and ordering behavior."
    columns:
      - name: session_id
        description: "Unique identifier for each session."
        tests:
          - unique
          - not_null

      - name: client_id
        description: "Client identifier associated with the session."

      - name: session_at
        description: "Timestamp when the session started."
        tests:
          - not_null

      - name: os
        description: "Operating system used in the session."

      - name: ip
        description: "IP address recorded for the session."

      - name: page_view_count
        description: "Number of page views in the session."

      - name: first_page_view_at
        description: "Timestamp of the first page view in the session."

      - name: last_page_view_at
        description: "Timestamp of the last page view in the session."

      - name: item_view_count
        description: "Number of item views in the session."

      - name: total_add_to_cart_quantity
        description: "Total quantity added to cart during the session."

      - name: total_remove_from_cart_quantity
        description: "Total quantity removed from cart during the session."

      - name: first_item_view_at
        description: "Timestamp of the first item view in the session."

      - name: last_item_view_at
        description: "Timestamp of the last item view in the session."

      - name: order_count
        description: "Number of distinct orders placed in the session."

      - name: first_order_at
        description: "Timestamp of the first order placed in the session."

      - name: last_order_at
        description: "Timestamp of the last order placed in the session."

      - name: total_shipping_cost
        description: "Total shipping cost from orders associated with the session."

      - name: has_order
        description: "Flag indicating whether the session resulted in at least one order."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]